<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; media-src 'self' blob:">
  <meta name="referrer" content="no-referrer">
  <title>Barritas — barcode utility</title>
  <meta name="description" content="Scan, decode and generate barcodes and fiducial markers in your browser. Nothing leaves your device.">
  <meta name="theme-color" content="#1f5fd1">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="bar">
      <div class="brand"><img src="icons/icon.svg" alt="" width="26" height="26"> Barritas</div>
      <label class="theme-toggle">Theme
        <select id="theme-select" aria-label="Colour theme">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" role="tab" id="tab-scan" aria-controls="panel-scan" aria-selected="true" data-tab="scan">Scan</button>
        <button class="tab" role="tab" id="tab-generate" aria-controls="panel-generate" aria-selected="false" tabindex="-1" data-tab="generate">Generate barcode</button>
        <button class="tab" role="tab" id="tab-fiducials" aria-controls="panel-fiducials" aria-selected="false" tabindex="-1" data-tab="fiducials">Generate marker</button>
        <button class="tab" role="tab" id="tab-about" aria-controls="panel-about" aria-selected="false" tabindex="-1" data-tab="about">About</button>
      </nav>
    </div>
  </header>

  <main id="main">
    <section id="panel-scan" role="tabpanel" aria-labelledby="tab-scan" tabindex="0">
      <p class="muted">Scanner coming in the next milestone.</p>
    </section>

    <section id="panel-generate" role="tabpanel" aria-labelledby="tab-generate" tabindex="0" hidden>
      <p class="muted">Barcode generator coming soon.</p>
    </section>

    <section id="panel-fiducials" role="tabpanel" aria-labelledby="tab-fiducials" tabindex="0" hidden>
      <p class="muted">Marker generator coming soon.</p>
    </section>

    <section id="panel-about" role="tabpanel" aria-labelledby="tab-about" tabindex="0" hidden>
      <div class="card">
        <h2>About Barritas</h2>
        <p>Scan, decode and generate barcodes and fiducial markers. Everything runs in your browser: no server, no tracking, no third-party requests.</p>
      </div>
    </section>
  </main>

  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="print-root" aria-hidden="true"></div>
</body>
</html>

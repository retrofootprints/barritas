<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Round-trip test — Barritas</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <script type="module" src="roundtrip.js"></script>
</head>
<body>
  <main>
    <div class="card">
      <h2>Generator round-trip test</h2>
      <p class="muted">Every generator format is rendered with bwip-js using its sample data, then decoded with zxing-wasm.
        “decoded” means it was read back but the text is formatted differently (e.g. ISSN → EAN-13). “n/a” means no in-browser decoder exists.</p>
      <p id="summary" class="msg warn">Running…</p>
      <div class="table-wrap">
        <table class="formats-table" id="out">
          <thead><tr><th>Format</th><th>bcid</th><th>Status</th><th>Detail</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
